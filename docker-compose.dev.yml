services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yusro_dev
      POSTGRES_USER: yusro_dev
      POSTGRES_PASSWORD: yusro_dev_only
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - yusro-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yusro_dev -d yusro_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
  ml:
    build: ./ml-service
    ports: ["8000:8000"]
  # minio tidak diperlukan untuk dev lokal karena backend menggunakan local filesystem storage (./uploads)
  # minio:
  #   image: minio/minio
  #   ports: ["9000:9000"]
  #   command: server /data

volumes:
  yusro-dev-db:
