services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yusro
      POSTGRES_USER: yusro
      POSTGRES_PASSWORD: yusro
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

  ml:
    build: ./ml-service
    ports:
      - "8000:8000"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: yusro
      MINIO_ROOT_PASSWORD: yusro-local-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-dev-data:/data

volumes:
  postgres-dev-data:
  minio-dev-data:
